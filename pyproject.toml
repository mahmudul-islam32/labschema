[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labschema"
dynamic = ["version"]
description = "A Python library that turns messy lab-style tables into typed schemas with physical units and validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LabSchema Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
keywords = ["schema", "validation", "lab", "data", "units", "csv", "pint"]
dependencies = [
    "pydantic>=2.5,<3",
    "pint>=0.23",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "pandas>=2.0",
]

[project.scripts]
labschema = "labschema.cli:main"

[project.urls]
Homepage = "https://github.com/mahmudul-islam32/labschema"
Documentation = "https://github.com/mahmudul-islam32/labschema/blob/main/docs/SPEC.md"
Repository = "https://github.com/mahmudul-islam32/labschema"
Issues = "https://github.com/mahmudul-islam32/labschema/issues"

[tool.hatch.version]
path = "src/labschema/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labschema"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM102", # nested if statements - keeping for readability in validation code
    "SIM103", # return negated condition - keeping for clarity in control flow
    "SIM105", # contextlib.suppress - explicit try/except is clearer here
    "SIM108", # ternary operator - if/else is clearer for complex cases
]

[tool.ruff.lint.isort]
known-first-party = ["labschema"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/labschema"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
